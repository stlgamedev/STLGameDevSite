Name: 'Time to Rogue'
Description: "A roguelike dungeon crawler for iPhone and Apple Watch where the resource is real-world time. Moving, attacking, and waiting spend focus, which recovers over hours, so you play in glances throughout your day. Rest too long, though, and the maze starts to hunt."
